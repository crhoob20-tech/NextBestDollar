name: MNQ research backtest

on:
  push:
    branches: [mnq-research]
    paths:
      - 'mnq_research/**'
      - '.github/workflows/mnq-research.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r mnq_research/requirements.txt

      - name: Run six-month proxy backtest
        run: python mnq_research/backtest.py

      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: mnq-research-results
          path: mnq_research/results/
          if-no-files-found: error
